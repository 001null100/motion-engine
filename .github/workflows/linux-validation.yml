name: Linux native validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-engine-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source provenance
        run: |
          git rev-parse HEAD | tee BUILD_SOURCE.txt
          git ls-files -s Source CMakeLists.txt >> BUILD_SOURCE.txt
          git archive --format=tar.gz -o MotionEngine-build-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: MotionEngine-build-source
          path: |
            MotionEngine-build-source.tar.gz
            BUILD_SOURCE.txt
          retention-days: 14
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev libxrender-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure native CLAP and tests
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Archive exact dependencies for reproducible tests
        run: tar --exclude=.git -czf MotionEngine-build-dependencies.tar.gz -C build-linux/_deps null_clap-src clap-src clap_helpers-src juce-src
      - uses: actions/upload-artifact@v4
        with:
          name: MotionEngine-build-dependencies
          path: MotionEngine-build-dependencies.tar.gz
          retention-days: 14
      - name: Build
        run: cmake --build build-linux --parallel 2
      - name: Test physics and framework contracts
        run: xvfb-run -a ctest --test-dir build-linux --output-on-failure
      - name: Upload actual editor renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotionEngine-editor-Linux
          path: build-linux/MotionEngine-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Linux CLAP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip" -o validator.zip
          unzip -q validator.zip -d validator-package
          ARCHIVE="$(find validator-package -type f -name '*.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p validator
          tar -xzf "$ARCHIVE" -C validator
          VALIDATOR="$(find validator -type f -name 'clap-validator' -print -quit)"
          test -n "$VALIDATOR"
          chmod +x "$VALIDATOR"
          xvfb-run -a "$VALIDATOR" validate build-linux/clap/MotionEngine.clap --only-failed
      - name: Package validated module
        run: |
          mkdir -p dist
          tar -czf dist/MotionEngine-Linux-CLAP.tar.gz -C build-linux/clap MotionEngine.clap
      - name: Upload validated module
        uses: actions/upload-artifact@v4
        with:
          name: MotionEngine-Linux-CLAP
          path: dist/MotionEngine-Linux-CLAP.tar.gz
          if-no-files-found: error
          retention-days: 14
