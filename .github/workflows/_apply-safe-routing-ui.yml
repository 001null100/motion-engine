name: Apply safe routing UI

on:
  push:
    branches: [fix/safe-aux-routing]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/safe-aux-routing
      - name: Rewrite retired MAP UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('Source/PluginEditor.cpp')
          s = p.read_text(encoding='utf-8')

          replacements = [
          ('''    styleButton(mapButton_, accent);\n    styleButton(clearButton_, accent2);''',
           '''    styleButton(mapButton_, accent);\n    styleButton(clearButton_, accent2);\n    mapButton_.setButtonText("AUX " + juce::String(index_ + 1));\n    mapButton_.setInterceptsMouseClicks(false, false);\n    clearButton_.setVisible(false);'''),
          ('''    mapButton_.onClick = [this] { plugin_.bridge().requestMap(index_); };\n    clearButton_.onClick = [this] { plugin_.bridge().requestUnmap(index_); };''',
           '''    // Direct controller-target mapping was retired because Bitwig exposes\n    // LastClickedParameter proxies publicly. Motion N aux -> Audio Rate is the\n    // supported target-routing path and cannot capture arbitrary host parameters.'''),
          ('''    clearButton_.setBounds(top.removeFromRight(28).reduced(2, 1));\n    mapButton_.setBounds(top.removeFromRight(56).reduced(2, 1));''',
           '''    clearButton_.setBounds({});\n    mapButton_.setBounds(top.removeFromRight(68).reduced(2, 1));'''),
          ('''    currentValue_ = snapshot.outputs[static_cast<std::size_t>(index_)];\n    if (status.armed)\n    {\n        targetLabel_.setText("move target parameter...", juce::dontSendNotification);\n        targetLabel_.setColour(juce::Label::textColourId, warm);\n        mapButton_.setButtonText("ARMED");\n        mapButton_.setColour(juce::TextButton::buttonColourId, warm.withAlpha(0.28f));\n    }\n    else if (status.mapped)\n    {\n        targetLabel_.setText(toJuce(status.targetName), juce::dontSendNotification);\n        targetLabel_.setColour(juce::Label::textColourId, text);\n        mapButton_.setButtonText("MAP");\n        mapButton_.setColour(juce::TextButton::buttonColourId, accent.withAlpha(0.28f));\n    }\n    else\n    {\n        targetLabel_.setText("unmapped | aux: Motion " + juce::String(index_ + 1), juce::dontSendNotification);\n        targetLabel_.setColour(juce::Label::textColourId, muted);\n        mapButton_.setButtonText("MAP");\n        mapButton_.setColour(juce::TextButton::buttonColourId, accent.withAlpha(0.12f));\n    }\n    repaint();''',
           '''    currentValue_ = snapshot.outputs[static_cast<std::size_t>(index_)];\n    targetLabel_.setText("Motion " + juce::String(index_ + 1) + " -> Bitwig Audio Rate", juce::dontSendNotification);\n    targetLabel_.setColour(juce::Label::textColourId, muted);\n    mapButton_.setButtonText("AUX " + juce::String(index_ + 1));\n    mapButton_.setColour(juce::TextButton::buttonColourId, accent.withAlpha(0.16f));\n    repaint();'''),
          ('''    outputsTitleLabel_.setText("MOTION OUTPUTS", juce::dontSendNotification);''',
           '''    outputsTitleLabel_.setText("MOTION OUTPUTS  ·  SAFE AUX ROUTING", juce::dontSendNotification);''')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected UI source block not found:\n' + old[:180])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit generated source edit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/PluginEditor.cpp
          git diff --cached --check
          git commit -m "Replace retired MAP controls with aux routing UI"
          git push origin HEAD:fix/safe-aux-routing
