name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAP_VALIDATOR_VERSION: 0.4.1
  CLAP_VALIDATOR_BUILD: 0.4.1-127-g152b982

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record exact build source
        shell: pwsh
        run: |
          git rev-parse HEAD | Out-File -Encoding utf8 BUILD_SOURCE.txt
          git ls-files -s Source CMakeLists.txt | Out-File -Append -Encoding utf8 BUILD_SOURCE.txt

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bridge/pom.xml

      - name: Configure native CLAP
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Motion Engine
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test physics, plugin contracts, editor and framework
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload actual editor renders
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MotionEngine-editor-Windows
          path: build/MotionEngine-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Validate CLAP
        shell: pwsh
        run: |
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "MotionEngine.clap" | Select-Object -First 1
          if (-not $clap) { throw "MotionEngine.clap was not produced" }
          $validatorZip = "clap-validator-$env:CLAP_VALIDATOR_BUILD-windows.zip"
          Invoke-WebRequest "https://github.com/free-audio/clap-validator/releases/download/$env:CLAP_VALIDATOR_VERSION/$validatorZip" -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath .clap-validator -Force
          $validator = Get-ChildItem -Path .clap-validator -Recurse -File -Filter "clap-validator.exe" | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe was not found" }
          & $validator.FullName validate $clap.FullName --only-failed
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Enforce safe Bitwig bridge
        shell: pwsh
        run: |
          $unsafe = Get-ChildItem bridge/src -Recurse -File -Filter "*.java" | Select-String -Pattern "LastClickedParameter|createLastClickedParameter"
          if ($unsafe) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw "Unsafe public Bitwig target proxy found in bridge source"
          }

      - name: Build Bitwig bridge
        shell: pwsh
        run: |
          mvn -B -f bridge/pom.xml package
          Copy-Item bridge/target/MotionEngineBridge.jar bridge/target/MotionEngineBridge.bwextension

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "MotionEngine.clap" | Select-Object -First 1
          if (-not $clap) { throw "MotionEngine.clap was not produced" }
          Copy-Item $clap.FullName "$dist/MotionEngine.clap" -Force
          Copy-Item bridge/target/MotionEngineBridge.bwextension "$dist/MotionEngineBridge.bwextension"
          Copy-Item docs/TESTING.md "$dist/TESTING.md"
          Copy-Item docs/MOTION_ENGINE_0_2_1.md "$dist/MOTION_ENGINE_0_2_1.md"
          Copy-Item BUILD_SOURCE.txt "$dist/BUILD_SOURCE.txt"
          Get-ChildItem $dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -Encoding utf8 "$dist/SHA256SUMS.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath "$PWD/MotionEngine-Windows-CLAP.zip" -Force
          Move-Item "$PWD/MotionEngine-Windows-CLAP.zip" "$dist/MotionEngine-Windows-CLAP.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MotionEngine-Windows-CLAP
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated beta release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $tag = "v2-beta-pr${{ github.event.pull_request.number }}-${{ github.run_number }}"
          } else {
            $tag = "v2-beta-${{ github.run_number }}"
          }
          $target = git rev-parse HEAD
          $notes = "Motion Engine 0.2.1 performance and editor pass. Exact tested checkout: $target. Persistent 240 Hz analysis/physics and causal sample-rate CV interpolation remove host-buffer-dependent modulation. Native CLAP note hits, coherent drag release, deferred state reset, retryable GUI edits and improved aux-output controls. The optional v0.3 bridge contains no public target proxies; use Motion 1-8 through Bitwig Audio Rate. Windows tests, bridge safety/build and clap-validator run before publication. Interactive Bitwig routing and DPI behavior still require verification. See MOTION_ENGINE_0_2_1.md and BUILD_SOURCE.txt."
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
          } else {
            gh release create $tag dist/* --prerelease --target $target --title "Motion Engine 0.2.1 / $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
          }
