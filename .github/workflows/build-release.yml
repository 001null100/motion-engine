name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAP_VALIDATOR_VERSION: 0.4.1
  CLAP_VALIDATOR_BUILD: 0.4.1-127-g152b982

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bridge/pom.xml

      - name: Configure native CLAP
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Motion Engine
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test physics core
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate CLAP
        shell: pwsh
        run: |
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "MotionEngine.clap" | Select-Object -First 1
          if (-not $clap) { throw "MotionEngine.clap was not produced" }
          $validatorZip = "clap-validator-$env:CLAP_VALIDATOR_BUILD-windows.zip"
          Invoke-WebRequest "https://github.com/free-audio/clap-validator/releases/download/$env:CLAP_VALIDATOR_VERSION/$validatorZip" -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath .clap-validator -Force
          $validator = Get-ChildItem -Path .clap-validator -Recurse -File -Filter "clap-validator.exe" | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe was not found" }
          & $validator.FullName validate $clap.FullName --only-failed
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Enforce safe Bitwig bridge
        shell: pwsh
        run: |
          $unsafe = Get-ChildItem bridge/src -Recurse -File -Filter "*.java" | Select-String -Pattern "LastClickedParameter|createLastClickedParameter"
          if ($unsafe) {
            $unsafe | ForEach-Object { Write-Host $_ }
            throw "Unsafe public Bitwig target proxy found in bridge source"
          }

      - name: Build Bitwig bridge
        shell: pwsh
        run: |
          mvn -B -f bridge/pom.xml package
          Copy-Item bridge/target/MotionEngineBridge.jar bridge/target/MotionEngineBridge.bwextension

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "MotionEngine.clap" | Select-Object -First 1
          if (-not $clap) { throw "MotionEngine.clap was not produced" }
          Copy-Item $clap.FullName "$dist/MotionEngine.clap" -Force
          Compress-Archive -Path "$dist/MotionEngine.clap" -DestinationPath "$dist/MotionEngine-Windows-CLAP.zip" -Force
          Copy-Item bridge/target/MotionEngineBridge.bwextension "$dist/MotionEngineBridge.bwextension"
          Copy-Item docs/TESTING.md "$dist/TESTING.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MotionEngine-Windows-CLAP
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2-beta-${{ github.run_number }}"
          gh release create $tag dist/* --prerelease --target "${{ github.sha }}" --title "Motion Engine v2 beta ${{ github.run_number }}" --notes "Motion Engine v2 beta from ${{ github.sha }}. Safe Bitwig bridge v0.3 creates no public target proxies; modulation uses the eight bipolar Motion 1-8 CLAP auxiliary outputs through Bitwig Audio Rate. Native CLAP, physics tests, bridge safety gate, bridge build, and clap-validator all pass before publication."